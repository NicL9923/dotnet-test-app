name: Deploy MinionTank

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: app-miniontank-aux
  AZURE_RESOURCE_GROUP: minion-tank-nicolaslayne
  AZURE_CLIENT_ID: 72320b41-a802-4446-9216-361ff91506c0
  AZURE_TENANT_ID: bb34272d-0432-4e5e-9f0f-e7aca4a450a8
  AZURE_SUBSCRIPTION_ID: bce49949-4505-4c57-9207-a84ce0f5c935

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: dotnet publish
        run: dotnet publish dotnet-test-app.csproj -c Release -o publish

      - name: Stamp commit metadata
        run: |
          echo "COMMIT_SHA=${GITHUB_SHA}" >> publish/.commit
          echo "BUILT_AT=$(date -u +%FT%TZ)" >> publish/.commit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://${{ env.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: staging
          package: publish
